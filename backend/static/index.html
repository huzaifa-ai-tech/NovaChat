<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaChat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", Inter, system-ui, sans-serif;
      background: #0b0918;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(600px 300px at 15% -5%, rgba(139, 92, 246, 0.18), transparent),
        radial-gradient(700px 350px at 90% 0%, rgba(99, 102, 241, 0.16), transparent),
        radial-gradient(800px 400px at 50% 110%, rgba(217, 70, 239, 0.1), transparent);
      pointer-events: none;
    }

    .app {
      position: relative;
      width: 100%;
      max-width: 1060px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(13, 10, 30, 0.55);
      backdrop-filter: blur(14px);
      border-left: 1px solid rgba(255, 255, 255, 0.06);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 10, 30, 0.7);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.5);
    }

    header h1 {
      font-size: 17px;
      letter-spacing: 0.3px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a5b4fc;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .clear-btn {
      margin-left: auto;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      border-color: #8b5cf6;
      color: #a78bfa;
      background: rgba(139, 92, 246, 0.12);
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    main::-webkit-scrollbar {
      width: 8px;
    }

    main::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.35);
      border-radius: 8px;
    }

    main::-webkit-scrollbar-track {
      background: transparent;
    }

    .welcome {
      text-align: center;
      padding: 28px 20px 10px;
    }

    .welcome .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1, #d946ef);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.55);
    }

    .welcome h2 {
      font-size: 22px;
      background: linear-gradient(90deg, #c4b5fd, #a5b4fc, #f0abfc);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome p {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 8px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 20px auto 6px;
      max-width: 640px;
    }

    .chip {
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(139, 92, 246, 0.35);
      background: rgba(139, 92, 246, 0.1);
      color: #c4b5fd;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: rgba(139, 92, 246, 0.25);
      border-color: #8b5cf6;
      color: #ede9fe;
      transform: translateY(-1px);
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .row.user {
      flex-direction: row-reverse;
    }

    .mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      line-height: 1;
    }

    .row.bot .mini-avatar {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
    }

    .row.user .mini-avatar {
      background: linear-gradient(135deg, #d946ef, #ec4899);
      color: #fff;
    }

    .bubble-wrap {
      max-width: 86%;
      display: flex;
      flex-direction: column;
    }

    .row.user .bubble-wrap {
      align-items: flex-end;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .row.bot .bubble {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom-left-radius: 4px;
    }

    .row.user .bubble {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
    }

    .row.error .bubble {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
    }

    .bubble p {
      margin: 0 0 8px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble strong {
      color: #c4b5fd;
    }

    .bubble ul, .bubble ol {
      margin: 6px 0 8px;
      padding-left: 20px;
    }

    .code-block {
      position: relative;
      margin: 10px 0;
      background: #0d0b1e;
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 12px;
      overflow: hidden;
    }

    .code-block pre {
      padding: 14px 16px;
      overflow-x: auto;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 13px;
      line-height: 1.55;
      color: #d8e2ff;
    }

    .code-block .copy-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #a5b4fc;
      font-size: 12px;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.2s;
    }

    .code-block .copy-btn:hover {
      opacity: 1;
      background: rgba(139, 92, 246, 0.2);
    }

    .time {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      padding: 0 4px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #a78bfa;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-3px); }
    }

    footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(13, 10, 30, 0.7);
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 6px 6px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      transition: border-color 0.2s;
    }

    .input-wrap:focus-within {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
      padding: 10px 0;
    }

    input::placeholder {
      color: #64748b;
    }

    button.send {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    button.send:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    button.send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hint {
      font-size: 11px;
      color: #475569;
      text-align: center;
      padding-bottom: 8px;
    }

    @media (max-width: 600px) {
      main { padding: 16px; }
      header { padding: 12px 16px; }
      footer { padding: 12px 16px; }
      .bubble-wrap { max-width: 88%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="avatar">N</div>
      <div>
        <h1>NovaChat</h1>
        <div class="status">
          <span class="status-dot"></span>
          Fine-tuned AI assistant
        </div>
      </div>
      <button class="clear-btn" id="clear">Clear</button>
    </header>

    <main id="chat"></main>

    <footer>
      <div class="input-wrap">
        <input id="input" type="text" placeholder="Ask me anything..." autocomplete="off" />
        <button class="send" id="send">Send</button>
      </div>
    </footer>
    <div class="hint">NovaChat remembers your conversation — use Clear to start fresh</div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const clearBtn = document.getElementById("clear");
    const history = [];

    const SUGGESTIONS = [
      "Who are you?",
      "What is AI?",
      "Explain machine learning",
      "What is LoRA?",
      "Tell me a joke",
      "What is a neural network?",
    ];

    function escapeHtml(s) {
      return s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function now() {
      return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatContent(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "";
      let inCode = false;
      let codeLines = [];
      let para = [];

      const flushPara = () => {
        if (para.length) {
          html += "<p>" + para.join("<br>") + "</p>";
          para = [];
        }
      };
      const flushCode = () => {
        if (codeLines.length) {
          html +=
            '<div class="code-block"><button class="copy-btn">Copy</button><pre><code>' +
            codeLines.join("\n") +
            "</code></pre></div>";
          codeLines = [];
        }
      };
      const isCodeLine = (l) =>
        /^\s{2,}/.test(l) ||
        /^(def |class |import |from |return |for |while |if |print\(|#)/.test(l);

      for (const raw of lines) {
        const l = raw;
        if (l.trim().startsWith("```")) {
          flushPara();
          flushCode();
          inCode = !inCode;
          continue;
        }
        if (inCode) {
          codeLines.push(l);
          continue;
        }
        if (isCodeLine(l)) {
          flushPara();
          codeLines.push(l);
          continue;
        }
        if (l.trim() === "") {
          flushPara();
          flushCode();
          continue;
        }
        para.push(l.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"));
      }
      flushPara();
      flushCode();
      return html;
    }

    function appendMessage(text, type) {
      const row = document.createElement("div");
      row.className = "row " + (type || "bot");

      const avatar = document.createElement("div");
      avatar.className = "mini-avatar";
      avatar.textContent = type === "user" ? "🧑" : "🤖";

      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (type === "user") {
        bubble.textContent = text;
      } else {
        bubble.innerHTML = formatContent(text);
      }

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = now();

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      row.appendChild(avatar);
      row.appendChild(wrap);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderWelcome() {
      const welcome = document.createElement("div");
      welcome.className = "welcome";
      welcome.innerHTML =
        '<div class="logo">N</div>' +
        "<h2>Hi! I'm NovaChat</h2>" +
        "<p>A fine-tuned AI assistant. Ask me anything about AI, coding, study tips and more.</p>";

      const chips = document.createElement("div");
      chips.className = "chips";
      SUGGESTIONS.forEach((q) => {
        const c = document.createElement("button");
        c.className = "chip";
        c.textContent = q;
        c.addEventListener("click", () => sendText(q));
        chips.appendChild(c);
      });

      chat.appendChild(welcome);
      chat.appendChild(chips);
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "row bot";
      row.innerHTML =
        '<div class="mini-avatar">🤖</div><div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
      return row;
    }

    async function sendText(message) {
      const text = message.trim();
      if (!text) return;
      input.value = "";
      appendMessage(text, "user");
      history.push({ role: "user", content: text });

      const typing = showTyping();
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history }),
        });
        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Request failed");
        }
        const data = await res.json();
        typing.remove();
        appendMessage(data.response, "bot");
        history.push({ role: "assistant", content: data.response });
      } catch (err) {
        typing.remove();
        appendMessage("Error: " + err.message, "error");
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function sendMessage() {
      sendText(input.value);
    }

    chat.addEventListener("click", (e) => {
      if (e.target.classList.contains("copy-btn")) {
        const code = e.target.closest(".code-block").querySelector("code");
        navigator.clipboard.writeText(code.textContent);
        e.target.textContent = "Copied!";
        setTimeout(() => (e.target.textContent = "Copy"), 1500);
      }
    });

    clearBtn.addEventListener("click", () => {
      history.length = 0;
      chat.innerHTML = "";
      renderWelcome();
      input.focus();
    });

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    renderWelcome();
    input.focus();
  </script>
</body>
</html>
